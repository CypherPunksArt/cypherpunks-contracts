[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1_000_000
evm_version = "cancun"
# read: encoded Descriptor art pages (tests deploy the real art from hex)
fs_permissions = [
  { access = "read", path = "script/descriptor-data" },
  { access = "read", path = "script/manual.txt" },
  { access = "read", path = "script/terminal.html" },
]
gas_limit = 3000000000
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 256, fail_on_revert = false }
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.heavy]
# full-domain sweeps and the 9,800-settlement walk
fuzz = { runs = 32 }

[profile.i12]
# I12 render-all: decodes every tokenURI off-chain (python) and pixel-diffs
# against the frozen renders — needs ffi, a scratch dir for the URI dumps,
# and headroom for 10,000 real tokenURI calls (~4M gas each) in one test
ffi = true
gas_limit = 100000000000
memory_limit = 1073741824
fs_permissions = [
  { access = "read", path = "script/descriptor-data" },
  { access = "read-write", path = "cache/i12" },
]
